name: Call main PR testing workflows

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'examples/**'
      - 'CODEOWNERS'
      - 'LICENSE'

jobs:
  spec_testing:
    name: "Spec testing"
    uses: ./.github/workflows/spec.yml
    secrets: inherit

  latest_m1_testing:
    name: "PE latest-1 Testing"
    needs: spec_testing
    uses: ./.github/workflows/pe_latest_1.yml
    secrets: inherit

  latest_testing:
    name: "PE latest Testing"
    needs: spec_testing
    uses: ./.github/workflows/pe_latest_testing.yml
    secrets: inherit
